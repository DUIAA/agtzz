<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>微光森林</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background: #16213e;
            display: flex;
            flex-direction: column;
        }
        canvas {
            width: 100%;
            flex: 1;
            image-rendering: pixelated;
            z-index: 1;
        }
        #menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #menu h1 {
            font-size: 2.5em;
            color: #7fdbca;
            text-shadow: 0 0 20px #7fdbca;
            margin-bottom: 10px;
        }
        #menu p {
            color: #888;
            margin-bottom: 40px;
            font-size: 0.9em;
        }
        .btn {
            background: #0f3460;
            border: 2px solid #7fdbca;
            color: #7fdbca;
            padding: 15px 40px;
            font-size: 1.2em;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            min-width: 200px;
        }
        .btn:active { background: #7fdbca; color: #0f3460; }
        #dialog {
            position: absolute;
            bottom: 120px;
            left: 10px;
            right: 10px;
            background: rgba(15, 52, 96, 0.95);
            border: 2px solid #7fdbca;
            border-radius: 10px;
            padding: 15px;
            display: none;
            z-index: 5;
        }
        #dialog .speaker { color: #ffd700; font-weight: bold; margin-bottom: 5px; }
        #dialog .text { font-size: 1em; line-height: 1.5; }
        #dialog .hint { color: #888; font-size: 0.8em; margin-top: 10px; text-align: right; }
        #battle {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #2d1b4e 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 8;
        }
        #battle .enemy { font-size: 4em; margin-bottom: 20px; }
        #battle .enemy-name { font-size: 1.2em; color: #ff6b6b; margin-bottom: 10px; }
        #battle .hp-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        #battle .hp-fill { height: 100%; transition: width 0.3s; }
        #battle .player-hp { background: #4ecca3; }
        #battle .enemy-hp { background: #ff6b6b; }
        #battle-menu {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        #battle-menu button {
            background: #0f3460;
            border: 2px solid #7fdbca;
            color: #7fdbca;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
        }
        #battle-menu button:active { background: #7fdbca; color: #0f3460; }
        #end-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }
        #end-screen h2 { font-size: 2em; margin-bottom: 20px; }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 5;
        }
        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 2px;
        }
        .dpad-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dpad-btn:active { background: rgba(127,219,202,0.5); }
        #action-btn {
            width: 80px;
            height: 80px;
            background: rgba(255,107,107,0.3);
            border: 2px solid #ff6b6b;
            border-radius: 50%;
            color: #ff6b6b;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #action-btn:active { background: rgba(255,107,107,0.6); }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            z-index: 5;
        }
        .quest-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            z-index: 5;
            color: #ffd700;
        }
    </style>
</head>
<body>
<div id="game">
    <canvas id="canvas"></canvas>
    
    <div id="menu">
        <h1>🌲 微光森林</h1>
        <p>一款手机浏览器 RPG</p>
        <button class="btn" onclick="startGame()">开始新游戏</button>
    </div>
    
    <div id="hud" style="display:none">
        ❤️ <span id="hp-text">100/100</span>
    </div>
    
    <div class="quest-hint" id="quest" style="display:none">
        📜 收集草药
    </div>
    
    <div id="dialog">
        <div class="speaker" id="dialog-speaker"></div>
        <div class="text" id="dialog-text"></div>
        <div class="hint">按确认键继续</div>
    </div>
    
    <div id="battle">
        <div class="enemy" id="enemy-sprite">🐾</div>
        <div class="enemy-name" id="enemy-name">史莱姆</div>
        <div>
            <div>敌人 HP</div>
            <div class="hp-bar"><div class="hp-fill enemy-hp" id="enemy-hp-bar"></div></div>
        </div>
        <div>
            <div>你的 HP</div>
            <div class="hp-bar"><div class="hp-fill player-hp" id="player-hp-bar"></div></div>
        </div>
        <div id="battle-menu">
            <button onclick="battleAction('attack')">攻击</button>
            <button onclick="battleAction('defend')">防御</button>
            <button onclick="battleAction('item')">道具</button>
            <button onclick="battleAction('run')">逃跑</button>
        </div>
    </div>
    
    <div id="end-screen">
        <h2 id="end-title"></h2>
        <p id="end-text"></p>
        <button class="btn" onclick="location.reload()">返回主菜单</button>
    </div>
    
    <div id="controls" style="display:none">
        <div id="dpad">
            <div></div><div class="dpad-btn" onclick="move(0,-1)">↑</div><div></div>
            <div class="dpad-btn" onclick="move(-1,0)">←</div><div></div><div class="dpad-btn" onclick="move(1,0)">→</div>
            <div></div><div class="dpad-btn" onclick="move(0,1)">↓</div><div></div>
        </div>
        <button id="action-btn" onclick="action()">OK</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 游戏状态
const STATE = { MENU: 0, EXPLORE: 1, DIALOG: 2, BATTLE: 3, END: 4 };
let state = STATE.MENU;

// 地图定义
const TILE_SIZE = 40;
const MAPS = {
    village: {
        name: "微光村庄",
        width: 15,
        height: 15,
        tiles: [
            "WWWWWWWWWWWWWWW",
            "WGGGGGGGGGGGGW",
            "WGGHHGGGGHHGGW",
            "WGGGGGGGGGGGGW",
            "WGGGGGGHGGGGGW",
            "WGGHHGGGGHHGGW",
            "WGGGGGGGGGGGGW",
            "WGGGGGGGGGGGGW",
            "WGGHHGGGGHHGGW",
            "WGGGGGGGGGGGGW",
            "WGGGGGGGHHHGGW",
            "WGGGGGGGGGGGGW",
            "WGGGGGGGGGGGGW",
            "WGGGGGGGGGGGGW",
            "WWWWWWWWWWWWWWW",
        ],
        exits: [{x: 7, y: 14, target: "forest", toX: 7, toY: 0}],
        npcs: [
            {x: 7, y: 7, sprite: "👴", name: "村长", dialogs: ["少年/少女，你终于醒了...", "我在这片森林边缘发现了你。", "你的记忆里好像有什么东西丢失了...", "去森林里收集一些草药吧，也许能想起什么。", "记得小心森林里的史莱姆。"]},
        ],
        items: []
    },
    forest: {
        name: "微光森林",
        width: 15,
        height: 15,
        tiles: [
            "GGGGGGGGGGGGGGG",
            "GGGGGGGGGGGGGGG",
            "GGHTGGGTHGGHTGG",
            "GGGGGGGGGGGGGGG",
            "GGGGHGGGTHGGGGG",
            "GGGGGGGGGGGGGGG",
            "GTHGGGGGGGHTGGG",
            "GGGGGGGGGGGGGGG",
            "GGGGHGGGTHGGGGG",
            "GGGGGGGGGGGGGGG",
            "GGHTGGGTHGGHTGG",
            "GGGGGGGGGGGGGGG",
            "GGGGGGGGGGGGGGG",
            "GGGGGGGGGGGGGGG",
            "GGGGGGGGGGGGGGG",
        ],
        exits: [{x: 7, y: 0, target: "village", toX: 7, toY: 13}],
        npcs: [],
        items: [
            {x: 3, y: 3, type: "herb", sprite: "🌿", collected: false},
            {x: 11, y: 7, type: "herb", sprite: "🌿", collected: false},
            {x: 7, y: 11, type: "herb", sprite: "🌿", collected: false},
        ],
        enemies: [
            {x: 4, y: 5, sprite: "🟢", name: "史莱姆", hp: 20, maxHp: 20, atk: 5, def: 0, defeated: false},
            {x: 10, y: 3, sprite: "🟢", name: "史莱姆", hp: 20, maxHp: 20, atk: 5, def: 0, defeated: false},
            {x: 7, y: 9, sprite: "🟢", name: "史莱姆", hp: 20, maxHp: 20, atk: 5, def: 0, defeated: false},
        ]
    }
};

// 玩家
let player = { x: 7, y: 7, hp: 100, maxHp: 100, atk: 10, def: 2, herbs: 0 };

// 当前地图
let currentMap = null;

// 对话
let dialogQueue = [];
let dialogIndex = 0;

// 战斗
let battleEnemy = null;
let battleDefending = false;

// 初始化
function init() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 键盘控制
    document.addEventListener('keydown', e => {
        if (state === STATE.EXPLORE) {
            if (e.key === 'ArrowUp') { e.preventDefault(); move(0, -1); }
            else if (e.key === 'ArrowDown') { e.preventDefault(); move(0, 1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); move(1, 0); }
            else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
        }
    });

    render();
    console.log('[DEBUG] init() 完成, state =', state, '(EXPLORE=' + STATE.EXPLORE + ')');
}

function resizeCanvas() {
    const game = document.getElementById('game');
    canvas.width = game.clientWidth;
    canvas.height = game.clientHeight - 150;
}

function startGame() {
    console.log('[DEBUG] startGame() 被调用');
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('quest').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';

    loadMap('village');
    state = STATE.EXPLORE;
    console.log('[DEBUG] state 已设为 EXPLORE (' + STATE.EXPLORE + '), currentMap =', currentMap ? currentMap.name : 'null');
    render();
}

function loadMap(name) {
    currentMap = JSON.parse(JSON.stringify(MAPS[name]));
    player.x = currentMap.exits[0].toX;
    player.y = currentMap.exits[0].toY;
}

// 移动
function move(dx, dy) {
    console.log('[DEBUG] move(' + dx + ', ' + dy + ') called, state=' + state + ', EXPLORE=' + STATE.EXPLORE);
    if (state !== STATE.EXPLORE) {
        console.log('[DEBUG] move() 被忽略: state=' + state + ' != EXPLORE=' + STATE.EXPLORE);
        return;
    }
    if (!currentMap) {
        console.log('[DEBUG] move() 被忽略: currentMap 为空');
        return;
    }
    
    const nx = player.x + dx;
    const ny = player.y + dy;
    
    if (nx < 0 || ny < 0 || nx >= currentMap.width || ny >= currentMap.height) return;
    
    const tile = currentMap.tiles[ny][nx];
    if (tile === 'W') return; // 墙
    
    player.x = nx;
    player.y = ny;
    
    // 检查出口
    for (const exit of currentMap.exits) {
        if (exit.x === nx && exit.y === ny) {
            loadMap(exit.target);
            render();
            return;
        }
    }
    
    // 检查物品
    for (const item of currentMap.items) {
        if (!item.collected && item.x === nx && item.y === ny) {
            item.collected = true;
            player.herbs++;
            updateHUD();
            showDialog("获得：草药 x" + player.herbs);
            if (player.herbs >= 3) {
                setTimeout(() => {
                    showDialog("村长：" + currentMap.npcs[0].dialogs[3]);
                    showDialog("任务完成！回去找村长吧。");
                }, 500);
            }
        }
    }
    
    // 检查NPC
    for (const npc of currentMap.npcs) {
        if (npc.x === nx && npc.y === ny) {
            showDialog(npc.name + "：" + npc.dialogs[0]);
            return;
        }
    }
    
    // 检查敌人
    for (const enemy of currentMap.enemies) {
        if (!enemy.defeated && enemy.x === nx && enemy.y === ny) {
            startBattle(enemy);
            return;
        }
    }
    
    render();
}

// 交互
function action() {
    if (state === STATE.DIALOG) {
        nextDialog();
        return;
    }
    
    if (state !== STATE.EXPLORE) return;
    
    // 检查前方 NPC
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    for (const [dx, dy] of dirs) {
        const nx = player.x + dx;
        const ny = player.y + dy;
        for (const npc of currentMap.npcs) {
            if (npc.x === nx && npc.y === ny) {
                const dialogIdx = parseInt(Math.random() * npc.dialogs.length);
                showDialog(npc.name + "：" + npc.dialogs[dialogIdx]);
                return;
            }
        }
    }
    
    // 检查任务完成
    if (player.herbs >= 3) {
        for (const npc of currentMap.npcs) {
            if (npc.x === player.x && npc.y === player.y) {
                if (npc.dialogs.includes("你的记忆里好像有什么东西丢失了...")) {
                    showDialog("村长：" + "谢谢你收集了草药！也许这些能帮你恢复记忆...");
                    showDialog("任务完成！你想找回自己的过去。");
                    setTimeout(() => showEnd(true), 1500);
                    return;
                }
            }
        }
    }
}

// 对话系统
function showDialog(text) {
    state = STATE.DIALOG;
    document.getElementById('dialog').style.display = 'block';
    document.getElementById('dialog-speaker').textContent = '';
    document.getElementById('dialog-text').textContent = text;
}

function nextDialog() {
    document.getElementById('dialog').style.display = 'none';
    state = STATE.EXPLORE;
}

// 战斗
function startBattle(enemy) {
    state = STATE.BATTLE;
    battleEnemy = JSON.parse(JSON.stringify(enemy));
    battleDefending = false;
    
    document.getElementById('battle').style.display = 'flex';
    document.getElementById('enemy-sprite').textContent = battleEnemy.sprite;
    document.getElementById('enemy-name').textContent = battleEnemy.name;
    updateBattleHP();
}

function battleAction(action) {
    if (state !== STATE.BATTLE) return;
    
    let playerDmg = 0;
    let enemyDmg = 0;
    
    if (action === 'attack') {
        battleDefending = false;
        playerDmg = Math.max(1, player.atk - battleEnemy.def + Math.floor(Math.random() * 4));
        battleEnemy.hp -= playerDmg;
        showBattleLog("你造成了 " + playerDmg + " 点伤害");
    } else if (action === 'defend') {
        battleDefending = true;
        showBattleLog("你进入防御姿态");
    } else if (action === 'run') {
        if (Math.random() > 0.3) {
            endBattle(false);
            return;
        } else {
            showBattleLog("逃跑失败！");
        }
    }
    
    if (battleEnemy.hp <= 0) {
        battleEnemy.defeated = true;
        showBattleLog("击败了 " + battleEnemy.name + "!");
        setTimeout(() => endBattle(true), 1000);
        return;
    }
    
    // 敌人回合
    setTimeout(() => {
        if (state !== STATE.BATTLE) return;
        enemyDmg = Math.max(1, battleEnemy.atk - (battleDefending ? player.def * 2 : player.def) + Math.floor(Math.random() * 3));
        player.hp -= enemyDmg;
        showBattleLog(battleEnemy.name + " 造成了 " + enemyDmg + " 点伤害");
        updateHUD();
        
        if (player.hp <= 0) {
            player.hp = 0;
            updateHUD();
            setTimeout(() => showEnd(false), 1000);
        } else {
            updateBattleHP();
        }
    }, 500);
}

function updateBattleHP() {
    const enemyPct = Math.max(0, battleEnemy.hp / battleEnemy.maxHp * 100);
    const playerPct = Math.max(0, player.hp / player.maxHp * 100);
    document.getElementById('enemy-hp-bar').style.width = enemyPct + '%';
    document.getElementById('player-hp-bar').style.width = playerPct + '%';
}

function showBattleLog(text) {
    // 简单处理，实际应该显示在战斗界面
    console.log(text);
}

function endBattle(won) {
    document.getElementById('battle').style.display = 'none';
    state = STATE.EXPLORE;
    if (won) {
        render();
    }
}

// HUD
function updateHUD() {
    document.getElementById('hp-text').textContent = player.hp + '/' + player.maxHp;
    document.getElementById('quest').textContent = player.herbs >= 3 ? "📜 回去找村长！" : "📜 收集草药: " + player.herbs + "/3";
}

// 结束画面
function showEnd(victory) {
    state = STATE.END;
    document.getElementById('battle').style.display = 'none';
    document.getElementById('dialog').style.display = 'none';
    document.getElementById('end-screen').style.display = 'flex';
    
    if (victory) {
        document.getElementById('end-title').textContent = '🎉 胜利！';
        document.getElementById('end-title').style.color = '#7fdbca';
        document.getElementById('end-text').textContent = '你成功完成了任务，找回了部分记忆...';
    } else {
        document.getElementById('end-title').textContent = '💀 失败';
        document.getElementById('end-title').style.color = '#ff6b6b';
        document.getElementById('end-text').textContent = '你在森林中倒下了...';
    }
}

// 渲染
function render() {
    if (state === STATE.MENU || state === STATE.END) return;
    
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (!currentMap) return;
    
    const offsetX = Math.floor(canvas.width / 2) - player.x * TILE_SIZE;
    const offsetY = Math.floor(canvas.height / 2) - player.y * TILE_SIZE;
    
    ctx.save();
    ctx.translate(offsetX, offsetY);
    
    // 绘制地图
    for (let y = 0; y < currentMap.height; y++) {
        for (let x = 0; x < currentMap.width; x++) {
            const tile = currentMap.tiles[y][x];
            let color = '#2d4a3e'; // 草地
            if (tile === 'W') color = '#5d4e37'; // 墙
            else if (tile === 'H') color = '#3d5a4e'; // 灌木
            ctx.fillStyle = color;
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            
            if (tile === 'H') {
                ctx.font = '24px serif';
                ctx.fillText('🌳', x * TILE_SIZE + 8, y * TILE_SIZE + 28);
            }
        }
    }
    
    // 绘制出口
    for (const exit of currentMap.exits) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '20px serif';
        ctx.fillText('➡️', exit.x * TILE_SIZE + 10, exit.y * TILE_SIZE + 28);
    }
    
    // 绘制物品
    for (const item of currentMap.items) {
        if (!item.collected) {
            ctx.font = '24px serif';
            ctx.fillText(item.sprite, item.x * TILE_SIZE + 8, item.y * TILE_SIZE + 28);
        }
    }
    
    // 绘制 NPC
    for (const npc of currentMap.npcs) {
        ctx.font = '28px serif';
        ctx.fillText(npc.sprite, npc.x * TILE_SIZE + 6, npc.y * TILE_SIZE + 30);
    }
    
    // 绘制敌人
    for (const enemy of currentMap.enemies) {
        if (!enemy.defeated) {
            ctx.font = '24px serif';
            ctx.fillText(enemy.sprite, enemy.x * TILE_SIZE + 8, enemy.y * TILE_SIZE + 28);
        }
    }
    
    // 绘制玩家
    ctx.font = '30px serif';
    ctx.fillText('🧑', player.x * TILE_SIZE + 5, player.y * TILE_SIZE + 30);
    
    ctx.restore();
}

init();
</script>
</body>
</html>
